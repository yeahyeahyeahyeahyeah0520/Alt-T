name: Feature request
description: Suggest a focused improvement to the terminal translation workflow.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What workflow is currently slow, risky, or confusing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior and how it should be triggered.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux X11
        - Linux Wayland
        - Cross-platform
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy considerations
      options:
        - label: I have considered whether the proposal changes what text leaves the machine.
