name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Installers
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (zero node-gyp)
        run: npm ci

      - name: Run full verification gate
        shell: pwsh
        env:
          FP_SMOKE: '1'
        run: npm run verify

      - name: Build Windows NSIS & Portable installers
        shell: pwsh
        run: npx electron-builder --win nsis portable --publish never

      - name: Stage artifacts and generate SHA256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageDir = Join-Path $PWD 'release-assets'
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          $searchRoots = @('release', 'dist') | Where-Object { Test-Path $_ }
          if ($searchRoots.Count -eq 0) {
            throw 'No electron-builder output directory (release/ or dist/) found.'
          }

          $artifacts = Get-ChildItem -Path $searchRoots -File | Where-Object {
            $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml'
          }
          if ($artifacts.Count -eq 0) {
            throw 'No Windows release artifacts (.exe / .blockmap / latest.yml) found.'
          }

          foreach ($file in $artifacts) {
            Copy-Item -Path $file.FullName -Destination (Join-Path $stageDir $file.Name) -Force
          }

          $checksumLines = Get-ChildItem -Path $stageDir -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksumPath = Join-Path $stageDir 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllLines($checksumPath, $checksumLines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content $checksumPath

      - name: Attach installers and checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/latest.yml
            release-assets/SHA256SUMS.txt
